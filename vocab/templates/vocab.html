<!DOCTYPE HTML PUBLIC "-//IETF//DTD HTML//EN">
<html> <head>

<!-- Bootstrap requires the following three meta tags to appear first -->
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">


<title>Vocabulary Anagram</title>

<!-- Javascript and Cascading Style Sheets (css) libraries -->
<!-- mostly from content delivery networks                 -->

<!-- jquery; CDN load is usually quick because it's likely cached -->
<script type="text/javascript"
     src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js">
</script>

<!-- Bootstrap stylesheet let's us have a 'responsive' layout; -->
<!-- 12 column grid rearranges itself for smaller screens or windows. -->

<!-- per http://getbootstrap.com/getting-started/  -->
<!-- Latest compiled and minified CSS -->
<link rel="stylesheet"
 href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css"
 integrity="sha384-1q8mTJOASx8j1Au+a5WDVnPi2lkFfwwEAa8hDDdjZlpLegxhjVME1fgjWPGmkzs7"
  crossorigin="anonymous">

<!-- Latest compiled and minified JavaScript -->
<script
 src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js"
 integrity="sha384-0mSbJDEHialfmuBBQP6A4Qrprq5OVfW37PRR3j5ELqxss1yVqOtnepnHVP9aJ7xS"
 crossorigin="anonymous">
</script>

<!-- Our own css file.  Note how we can link directly here and not -->
<!-- write any routing code in the Flask application. -->
<link rel="stylesheet" href="/static/jumble.css" />

</head>

<body>
<div class="container">

  <div class="row">
    <div class="col-xs-6 text-center">
      <h1>Words</h1>
    </div>
  </div>
<!-- Vocabularly words layed out in 6 columns;
  -- bootstrap may collapse to fewer columns and
  -- more rows if the window is narrow.
  -->
<div class="row">
  {% for word in g.vocab %}
    <div class="col-xs-2 text-center"> {{ word }} </div>
    {% if loop.index is divisibleby 3 %}
    </div> <!-- row -->
    <div class="row">
    {% endif %}
  {% endfor %}
</div> <!-- row -->

<br />

<div class="row">
  <div class="col-xs-6 text-center">
   Use letters from
  </div>
  </div><div class="row">
  <div class="col-xs-6 text-center lead">
    <strong>{{ session.jumble }}</strong>
  </div>
  </div><div class="row">
  <div class="col-xs-6 text-center">
    to spell {{session.target_count}} words from the list.
  </div> <!-- col -->
</div> <!-- row -->
<br />
<div class="row">
  <div class="col-xs-6 text-center">
<form id="entry">
    <label for="attempt">Word:</label>
    <input id="attempt" name="attempt" type="text" width="15"
      autocomplete="off"  autofocus />
  </form>
</div></div>

<br />

<!-- JavaScript fills in the found words and messages below -->
<h2>You found </h2>
<p id="results">
  {% for match in session.matches %}
  {{ match }} 
  {% endfor %}
</p>

<p id="message" class="message"></p>

<script>
// Suppress normal form submission (pressing Enter would reload the page).
// Enter is our "I'm done typing, tell me what's wrong" action, so we
// ask the server again and this time show its message.
$("#entry").submit( function(event) {
  event.preventDefault();
  checkWord(true);
});

// On each keystroke, ask the server about the current contents of the box.
// 'keyup' is used because the input's value is already updated by then.
$("#attempt").keyup( function(event) {
  var letter = String.fromCharCode(event.which);
  // keyup also fires for Shift, Backspace, Enter, etc.; only react to letters
  if (! "ABCDEFGHIJKLMNOPQRSTUVWXYZ".includes(letter)) { return; }
  checkWord(false);
});

// Send the current text to the server and update the page from the reply.
// showMessage: whether to display the server's complaint (see above).
function checkWord(showMessage) {
  var txt = $("#attempt").val();
  $.getJSON("/_check", { attempt: txt }, function(data) {
    var result = data.result;

    if (result.new_match) {
      // Redraw the list of found words and clear the box for the next one
      $("#results").text(result.matches.join(" "));
      $("#attempt").val("");
      $("#message").text("");
    } else if (showMessage) {
      // .text() (not .html()) because the message contains what the user typed
      $("#message").text(result.message);
    } else {
      $("#message").text("");
    }

    if (result.done) {
      window.location.href = "{{ url_for('success') }}";
    }
  });
}
</script>



 </div> <!-- container -->
</body> </html>
